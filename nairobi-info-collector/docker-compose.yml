version: '3.8'

services:
  nairobi-collector:
    build: .
    container_name: nairobi-info-collector
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    command: python main.py --mode continuous --interval 30

  # Optional: PostgreSQL database
  postgres:
    image: postgres:15
    container_name: nairobi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nairobi_db
      POSTGRES_USER: nairobi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Optional: Redis cache
  redis:
    image: redis:7-alpine
    container_name: nairobi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
